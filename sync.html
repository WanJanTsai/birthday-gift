    <!-- 爆米花紙花特效 CDN -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cute: ['"Fredoka"', '"Nunito"', '"Microsoft JhengHei"', 'sans-serif'],

    <style>
        body {
            font-family: 'Fredoka', 'Nunito', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #FFF5F5 0%, #E8F5E9 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;

        /* 背景飄浮泡泡效果 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(165, 214, 167, 0.2);
            animation: floatUp 8s infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* 甜美微陰影與 Q 彈縮放 */
        .cute-card {
            box-shadow: 0 10px 30px rgba(109, 76, 65, 0.08);
            border: 3px solid #6D4C41;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cute-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(109, 76, 65, 0.12);
        }

        /* 可愛按鈕動態 */
        .cute-btn {
            border: 3px solid #6D4C41;
            box-shadow: 0 4px 0 #6D4C41;
            transition: all 0.1s ease;
        }

            transform: translateY(4px);

        @keyframes wave {

            20% { transform: rotate(-8deg) scale(1.05); }
            40% { transform: rotate(6deg) scale(1.05); }
            60% { transform: rotate(-4deg) scale(1.03); }
            80% { transform: rotate(2deg) scale(1.01); }
        }
        .happy-shake-active {
            animation: cupShaking 0.6s ease-in-out !important;
        }
    </style>
</head>

    <!-- 真實零相依性核心邏輯 (使用 kvdb 進行完全通暢的雙機同步) -->
    <script>
        const TOTAL_BUDGET = 6000;
        let remaining = TOTAL_BUDGET;
        let historyList = [];
        let confirmCallback = null;
        let selectedDrinkName = ""; 
        
        let syncKey = ""; // 這將存放真實的雲端房間 ID
        let isSyncing = false; // 防止重複拉取

        // 🛡️ 本地安全儲存
        const safeStorage = {
            getItem(key) {
                try { return localStorage.getItem(key); } 
                catch (e) { return window[key] || null; }
            },
            setItem(key, value) {
                try { localStorage.setItem(key, value); } 
                catch (e) { window[key] = value; }
            }
        };

        // ⏱️ 網絡超時請求保護
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 8000 } = options; 
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        // 🎛️ 彈窗顯現/隱藏控制
        function openModal(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        }
        function closeModal(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        }

        function showAlert(title, text) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertText').innerText = text;
            openModal('alertModal');
        }
        function closeAlertModal() { closeModal('alertModal'); }

        function showConfirm(title, text, onConfirm) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmText').innerText = text;
            confirmCallback = onConfirm;
            openModal('confirmModal');
        }
        function closeConfirmModal(isConfirmed) {
            closeModal('confirmModal');
            if (isConfirmed && confirmCallback) confirmCallback();
            confirmCallback = null;
        }

        // 🎛️ 雲端同步狀態指示器更換
        function updateSyncStatus(status) {
            const statusText = document.getElementById("syncStatusText");
            const pingDot = document.getElementById("syncIndicatorPing");
            const statusDot = document.getElementById("syncIndicatorDot");
            
            if (!statusText || !pingDot || !statusDot) return;

            if (status === "connected") {
                statusText.innerText = "雙機即時對齊中 🟢";
                statusText.className = "font-bold text-matcha-700";
                pingDot.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75";
                statusDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500";
            } else if (status === "timeout") {
                statusText.innerText = "連線稍慢，請稍候 🟡";
                statusText.className = "font-bold text-amber-600";
                pingDot.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75";
                statusDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500";
            } else if (status === "offline") {
                statusText.innerText = "連線異常，單機儲存中 🔴";
                statusText.className = "font-bold text-rose-500";
                pingDot.className = "absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-0";
                statusDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500";
            }
        }

        // 📋 智慧複製一鍵同步網址
        function copyShareLink() {
            if (!syncKey) {
                showAlert("⚠️ 房間建立中", "正在為您申請雲端房間，請稍候再複製喔！");
                return;
            }
            const shareUrl = window.location.origin + window.location.pathname + "?sync=" + syncKey;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareUrl)
                .then(() => showAlert("📋 複製同步連結成功！", "已複製「多人連線專屬連結」至剪貼簿！\n\n用 LINE 傳給男友點開，他的手機就會瞬間連上這個房間！💖"))
                .catch(() => fallbackCopyText(shareUrl));
            } else {
                fallbackCopyText(shareUrl);
            }
        }

        function fallbackCopyText(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            tempInput.setAttribute("readonly", "");
            document.body.appendChild(tempInput);
            
            const isiOS = navigator.userAgent.match(/ipad|iphone/i);
            if (isiOS) {
                const range = document.createRange();
                range.selectNodeContents(tempInput);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                tempInput.setSelectionRange(0, 999999);
            } else {
                tempInput.select();
            }

            try {
                if (document.execCommand("copy")) {
                    showAlert("📋 複製同步連結成功！", "已複製「多人連線專屬連結」至剪貼簿！\n\n用 LINE 傳給男友點開，他的手機就會瞬間連上這個房間！💖");
                } else {
                    throw new Error("fail");
                }
            } catch (err) {
                showAlert("📋 請手動長按複製網址", `手機系統安全限制阻擋了自動複製，請「長按選取」下方整串網址複製：\n\n${text}`);
            }
            document.body.removeChild(tempInput);
        }

        // 🔗 網址/代碼提取
        function extractSyncKey(input) {
            if (!input) return null;
            input = input.trim();
            if (input.includes('sync=')) {
                try {
                    const urlParams = new URLSearchParams(input.substring(input.indexOf('?')));
                    const key = urlParams.get('sync');
                    if (key) return key.trim();
                } catch(e) {}
            }
            // 過濾出真實的英數字 ID
            const cleaned = input.replace(/[^a-zA-Z0-9]/g, '');
            if (cleaned.length > 5) return cleaned;
            return null;
        }

        // ☁️ 核心通訊 1：真實建立雲端房間！(絕不憑空捏造)
        async function createNewCloudRoom() {
            try {
                // 正式向 kvdb 申請一個合法 bucket
                const response = await fetchWithTimeout('https://kvdb.io/', { method: 'POST' });
                if (response.ok) {
                    const bucketId = await response.text();
                    return bucketId.trim();
                }
            } catch (e) {
                console.error("雲端房間建立失敗", e);
            }
            return null;
        }

        // ☁️ 核心通訊 2：從雲端房間拉取資料
        async function pullFromCloud() {
            if (!syncKey) return;

            try {
                // GET 拉取狀態
                const response = await fetchWithTimeout(`https://kvdb.io/${syncKey}/state`, {
                    method: 'GET'
                });
                
                if (response.ok) {
                    const text = await response.text();
                    if (text) {
                        const data = JSON.parse(text);
                        if (data && typeof data.remainingBudget === 'number') {
                            let needUpdate = false;
                            // 只有雲端資料有異動時才更新畫面，防止閃爍
                            if (remaining !== data.remainingBudget || JSON.stringify(historyList) !== JSON.stringify(data.logs)) {
                                remaining = data.remainingBudget;
                                historyList = data.logs || [];
                                needUpdate = true;
                            }
                            if (needUpdate) {
                                updateUI(false); 
                            }
                        }
                    }
                    updateSyncStatus("connected");
                } else if (response.status === 404) {
                    // 若房間裡還沒有紀錄，就把目前的 6000 元寫入
                    await pushToCloud();
                } else {
                    updateSyncStatus("offline");
                }
            } catch (err) {
                updateSyncStatus("timeout");
            }
        }

        // ☁️ 核心通訊 3：推送資料至雲端房間
        async function pushToCloud() {
            if (!syncKey) return;

            try {
                // POST 覆寫狀態
                const response = await fetchWithTimeout(`https://kvdb.io/${syncKey}/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ remainingBudget: remaining, logs: historyList })
                });
                if (response.ok) {
                    updateSyncStatus("connected");
                }
            } catch (err) {
                updateSyncStatus("timeout");
            }
        }

        function getQueryParam(param) {
            try { return new URLSearchParams(window.location.search).get(param); } 
            catch(e) { return null; }
        }

        // 🚀 初始化全系統
        async function initApp() {
            // 一鍵配對檢查：如果網址帶有 ?sync=，強制覆蓋為該雲端房間
            let urlSyncKey = getQueryParam('sync');
            if (urlSyncKey) {
                urlSyncKey = extractSyncKey(urlSyncKey);
                if(urlSyncKey) {
                    safeStorage.setItem('drinkSyncKey', urlSyncKey);
                    try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e) {}
                    showAlert("💚 房間連接成功！", "已成功進入專屬飲料雲端頻道！雙機即時連線已啟動！🎉");
                }
            }

            syncKey = safeStorage.getItem('drinkSyncKey');

            // 載入本地快取墊檔
            const savedRemaining = safeStorage.getItem('drink_remaining');
            remaining = parseInt(savedRemaining);
            if (isNaN(remaining)) remaining = TOTAL_BUDGET;
            try { historyList = JSON.parse(safeStorage.getItem('drink_history')) || []; } catch(e) { historyList = []; }
            updateUI(false);

            // 【最關鍵修復】：如果本地沒有房間 ID，我們「真實去申請一個」，絕對不捏造！
            if (!syncKey) {
                updateSyncStatus("timeout");
                document.getElementById('syncKeyDisplay').innerText = "建立中...";
                
                syncKey = await createNewCloudRoom();
                if (syncKey) {
                    safeStorage.setItem('drinkSyncKey', syncKey);
                    await pushToCloud(); // 申請成功後，立刻上傳初始資料
                } else {
                    showAlert("⚠️ 雲端申請失敗", "無法向伺服器申請房間，系統暫時切換為單機儲存模式。請確認網路狀態後重整網頁。");
                }
            }

            if (syncKey) {
                document.getElementById('syncKeyDisplay').innerText = syncKey;
                
                // 啟動首次雲端對齊
                await pullFromCloud();

                // ⏱️ 啟動 3 秒真實背景拉取
                setInterval(async () => {
                    if (isSyncing) return;
                    isSyncing = true;
                    await pullFromCloud();
                    isSyncing = false;
                }, 3000);
            }
        }

        function updateUI(writeToCloud = true) {
            const spent = TOTAL_BUDGET - remaining;
            document.getElementById('remainingMoney').innerText = remaining.toLocaleString();
            document.getElementById('spentMoney').innerText = spent.toLocaleString();

            const percentage = (remaining / TOTAL_BUDGET) * 100;
            const displayPercentage = Math.max(Math.min(95, percentage), 15);
            document.getElementById('liquid').style.height = displayPercentage + '%';

            safeStorage.setItem('drink_remaining', remaining);
            safeStorage.setItem('drink_history', JSON.stringify(historyList));
            if (syncKey) {
                safeStorage.setItem('drinkSyncKey', syncKey);
                document.getElementById('syncKeyDisplay').innerText = syncKey;
            }

            const cupMouth = document.getElementById('cupMouth');
            if (remaining <= 0) cupMouth.className = "w-4 h-2 border-t-4 border-[#2b1e16] rounded-full mt-1"; 
            else cupMouth.className = "w-4 h-2 border-b-4 border-[#2b1e16] rounded-full";

            if (writeToCloud && syncKey) {
                pushToCloud();
            }
            renderHistory();
        }

        // 🍃 Preset 飲料點選
        function selectDrink(name, defaultPrice, btnElement) {
            selectedDrinkName = name;
            document.getElementById('selectedDrinkLabel').innerText = name;
            document.getElementById('drinkPrice').value = defaultPrice;

            const buttons = document.querySelectorAll('.preset-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-matcha-200', 'border-matcha-600', 'scale-[1.03]', 'shadow-md');
                btn.classList.add('bg-[#FBFBF2]', 'border-matcha-200');
            });

            btnElement.classList.remove('bg-[#FBFBF2]', 'border-matcha-200');
            btnElement.classList.add('bg-matcha-200', 'border-matcha-600', 'scale-[1.03]', 'shadow-md');
        }

        function resetDrinkSelection() {
            selectedDrinkName = "";
            document.getElementById('selectedDrinkLabel').innerText = "尚未選擇 🥤";
            document.getElementById('drinkPrice').value = "";
            const buttons = document.querySelectorAll('.preset-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-matcha-200', 'border-matcha-600', 'scale-[1.03]', 'shadow-md');
                btn.classList.add('bg-[#FBFBF2]', 'border-matcha-200');
            });
        }

        // 🥤 扣款
        function redeemDrink() {
            const priceInput = document.getElementById('drinkPrice');
            const price = parseInt(priceInput.value);

            if (!selectedDrinkName) { showAlert("💡 提示", "請先點選一杯上方好喝的茶飲卡片唷！"); return; }
            if (isNaN(price) || price <= 0) { showAlert("💡 提示", "請確認飲料金額是否填寫正確唷！"); return; }
            if (price > remaining) { showAlert("😢 額度不足囉！", "目前剩餘金額為 $" + remaining + "。6,000 元已經花光光了！"); return; }

            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            btnText.classList.add('invisible');
            btnLoading.classList.remove('hidden');

            const entireCupGroup = document.getElementById('entireCupGroup');
            entireCupGroup.classList.add('happy-shake-active');

            remaining -= price;
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            historyList.unshift({ id: Date.now(), name: selectedDrinkName, price: price, date: dateStr });
            
            triggerConfetti();
            resetDrinkSelection();
            updateUI(true); // 這裡傳 true，扣款後會立刻推上雲端！

            setTimeout(() => {
                entireCupGroup.classList.remove('happy-shake-active');
                btnText.classList.remove('invisible');
                btnLoading.classList.add('hidden');
            }, 600);
        }

        function renderHistory() {
            const container = document.getElementById('logContainer');
            container.innerHTML = '';

            if (historyList.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400 text-center py-4">目前還沒有兌換紀錄唷，快去買飲料！</p>`;
                return;
            }

            historyList.forEach((item) => {
                const logItem = document.createElement('div');
                logItem.className = 'flex justify-between items-center bg-[#FBFBF2] p-3 rounded-xl border-2 border-peach-100 hover:border-matcha-200 transition-colors duration-150';
                logItem.innerHTML = `
                    <div class="text-left">
                        <p class="font-bold text-[#6D4C41] text-sm">${item.name}</p>
                        <p class="text-[10px] text-gray-400">${item.date}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-cute font-extrabold text-[#6D4C41]">-$${item.price}</span>
                        <button onclick="deleteLog(${item.id}, ${item.price})" class="text-gray-300 hover:text-red-500 transition-colors">
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(logItem);
            });
        }

        function deleteLog(id, price) {
            showConfirm("💡 刪除確認", "確定要取消這筆紀錄嗎？金額會退回扣打中喔！", () => {
                remaining = Math.min(TOTAL_BUDGET, remaining + price);
                historyList = historyList.filter(item => item.id !== id);
                updateUI(true); // 刪除後也推上雲端
            });
        }

        function confirmReset() {
            const password = prompt("⚠️ 警告：這會將所有的兌換紀錄重設！\n請輸入「reset」：");
            if (password === "reset") {
                remaining = TOTAL_BUDGET;
                historyList = [];
                resetDrinkSelection();
                updateUI(true);
                showAlert("✨ 系統已重置", "系統已成功重置為 6000 元！");
            } else if (password !== null) {
                showAlert("❌ 重置失敗", "密碼輸入錯誤。");
            }
        }

        // 🔗 貼上網址與配對
        function openSyncModal() {
            document.getElementById('syncInput').value = "";
            openModal('syncModal');
        }
        function closeSyncModal() { closeModal('syncModal'); }

        async function pasteToInput() {
            try {
                if (navigator.clipboard) {
                    const text = await navigator.clipboard.readText();
                    document.getElementById('syncInput').value = text;
                    showAlert("📋 讀取成功", "已將剪貼簿內容貼上，請點擊「確認連線」！");
                } else { throw new Error("unsupported"); }
            } catch (e) {
                const input = prompt("瀏覽器不支援自動讀取剪貼簿。\n請直接長按下方對話框貼上「專屬同步網址」：");
                if (input) { document.getElementById('syncInput').value = input; }
            }
        }

        function submitSyncCode() {
            const rawInput = document.getElementById('syncInput').value;
            const cleanKey = extractSyncKey(rawInput);
            if (!cleanKey) {
                showAlert("❌ 格式不正確", "請貼上完整的專屬同步網址喔！");
                return;
            }

            showConfirm("⚡ 確定連線？", `連線至朋友的雲端房間將覆蓋此裝置現有紀錄！確定嗎？`, async () => {
                const btnText = document.getElementById('syncBtnText');
                const btnLoading = document.getElementById('syncBtnLoading');
                btnText.classList.add('invisible');
                btnLoading.classList.remove('hidden');

                syncKey = cleanKey;
                safeStorage.setItem('drinkSyncKey', syncKey);
                
                // 配對後立刻去雲端拉取一次最新資料
                await pullFromCloud();

                setTimeout(() => {
                    closeSyncModal();
                    triggerConfetti();
                    btnText.classList.remove('invisible');
                    btnLoading.classList.add('hidden');
                    showAlert("🎉 連線成功！", `已成功切換雲端頻道，即時同步已啟動！`);
                }, 800);
            });
        }

        // 🔄 手動刷新
        async function manualSync() {
            updateSyncStatus("timeout");
            await pullFromCloud();
        }

        function triggerConfetti() {
            try {
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.8 }, colors: ['#86A789', '#FF8E9E', '#E4A564', '#FFF5E4'] });
            } catch(e) {}
        }

        // 將所有函式掛載至 window 供 HTML 事件調用
        window.copyShareLink = copyShareLink;
        window.openSyncModal = openSyncModal;
        window.closeSyncModal = closeSyncModal;
        window.pasteToInput = pasteToInput;
        window.submitSyncCode = submitSyncCode;
        window.selectDrink = selectDrink;
        window.redeemDrink = redeemDrink;
        window.deleteLog = deleteLog;
        window.confirmReset = confirmReset;
        window.closeAlertModal = closeAlertModal;
        window.closeConfirmModal = closeConfirmModal;
        window.manualSync = manualSync;

        // 網頁載入時啟動
        window.onload = function() {
            initApp();
        }
    </script>
</body>
</html>
